permissions:
  contents: write
name: Build Pokeet Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Permanent Release Keystore
        run: |
          mkdir -p android/app
          if [ ! -f android/app/pokeet-release.jks ]; then
            keytool -genkeypair -v -keystore android/app/pokeet-release.jks -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias pokeet -storepass pokeetReleaseKey2026 -keypass pokeetReleaseKey2026 -dname "CN=Pokeet, OU=Dev, O=Pokeet, L=Pabna, S=Rajshahi, C=BD"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/pokeet-release.jks
            git commit -m "chore: add permanent release keystore [skip ci]"
            git push
          fi

      - name: Bundle Offline Bengali Font
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/NotoSansBengali.ttf ]; then
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/NotoSansBengali%5Bwdth%2Cwght%5D.ttf" -o assets/fonts/NotoSansBengali.ttf || \
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/hindsiliguri/HindSiliguri-Regular.ttf" -o assets/fonts/NotoSansBengali.ttf
          fi

      - name: Generate missing Android skeleton & preserve custom Gradle/ProGuard
        run: |
          mkdir -p .backup_android
          [ -f android/app/build.gradle.kts ] && cp android/app/build.gradle.kts .backup_android/
          [ -f android/app/proguard-rules.pro ] && cp android/app/proguard-rules.pro .backup_android/
          [ -f android/app/pokeet-release.jks ] && cp android/app/pokeet-release.jks .backup_android/

          flutter create . --org com.pokeet --project-name pokeet --platforms=android

          [ -f .backup_android/build.gradle.kts ] && cp .backup_android/build.gradle.kts android/app/build.gradle.kts
          [ -f .backup_android/proguard-rules.pro ] && cp .backup_android/proguard-rules.pro android/app/proguard-rules.pro
          [ -f .backup_android/pokeet-release.jks ] && cp .backup_android/pokeet-release.jks android/app/pokeet-release.jks
          [ -f android/app/build.gradle.kts ] && rm -f android/app/build.gradle
          rm -rf .backup_android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: rm -rf test && flutter analyze || true

      - name: Build Release APK
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/app/outputs/flutter-apk/Pokeet-v2.0.${{ github.run_number }}.apk"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Pokeet v2.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/Pokeet-v2.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
